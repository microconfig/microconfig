apply plugin: 'application'
apply plugin: 'maven-publish'
apply plugin: 'com.gradleup.shadow'

application {
    mainClass = 'io.microconfig.MicroconfigMain'
}

def generateVersionProperties = tasks.register('generateVersionProperties') {
    def projectVersion = project.version.toString()
    def versionFile = layout.buildDirectory.file('generated/resources/version/version.properties')

    inputs.property('version', projectVersion)
    outputs.file(versionFile)

    doLast {
        def resource = versionFile.get().asFile
        resource.parentFile.mkdirs()
        resource.setText("version=${projectVersion}\n", 'UTF-8')
    }
}

tasks.named('processResources') {
    from(generateVersionProperties)
}

// the CLI ships only as a fat jar: it takes the main artifact name and the thin jar is neither built nor published
['jar', 'startScripts', 'distZip', 'distTar', 'installDist'].each {
    tasks.named(it) { enabled = false }
}

tasks.named('shadowJar') {
    archiveClassifier = ''
}

components.java.withVariantsFromConfiguration(configurations.apiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.runtimeElements) { skip() }

dependencies {

    implementation project(':microconfig-core'),
            project(':utils')
}
