[versions]
spring-boot = "4.1.2"
shadow = "9.6.1"
jacoco = "0.8.16"
kotlin = "2.3.21"
dokka = "2.2.0"

# versions of the libraries without one come from the Spring Boot BOM
[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
jmustache = { module = "com.samskivert:jmustache" }
spring-expression = { module = "org.springframework:spring-expression" }
snakeyaml = { module = "org.yaml:snakeyaml" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
