name: "Build Release"

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    name: "Build Jar"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Build Jar
        run: ./gradlew shadowJar
      - name: Rename Jar
        shell: bash
        run: mv microconfig-cli/build/libs/microconfig-cli-*-all.jar microconfig-cli/build/libs/microconfig.jar
      - uses: actions/upload-artifact@v7
        with:
          name: microconfig.jar
          path: microconfig-cli/build/libs/microconfig.jar
  alpine:
    name: "Build Alpine"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: microconfig.jar
      - name: Build Binary
        shell: bash
        run: |
          mkdir volume
          docker build -t microconfig:alpine -f .github/scripts/native/Dockerfile-alpine .
          docker run -v "$PWD/volume":/volume microconfig:alpine
      - uses: actions/upload-artifact@v7
        with:
          name: microconfig-alpine
          path: volume/microconfig
  linux:
    name: "Build Linux"
    needs: build
    # native binary links against the runner's glibc: an older image keeps it runnable on older distros
    runs-on: ubuntu-24.04
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: microconfig.jar
      - name: Install GraalVM Native Image
        shell: bash
        run: .github/scripts/native/graalvm-linux.sh
      - name: Build Binary
        shell: bash
        run: .github/scripts/native/native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: microconfig-linux
          path: ./microconfig

  windows:
    name: "Build Windows"
    needs: build
    runs-on: windows-2022
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: microconfig.jar
      - name: Install GraalVM Native Image
        shell: bash
        run: .github/scripts/native/graalvm-win.sh
      - name: Build Binary
        shell: bash
        run: .github/scripts/native/native.bat
      - uses: actions/upload-artifact@v7
        with:
          name: microconfig-windows
          path: microconfig.exe

  macos:
    name: "Build MacOS"
    needs: build
    runs-on: macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Download Jar
        uses: actions/download-artifact@v8
        with:
          name: microconfig.jar
      - name: Install GraalVM Native Image
        shell: bash
        run: .github/scripts/native/graalvm-mac.sh
      - name: Build Binary
        shell: bash
        run: .github/scripts/native/native.sh
      - uses: actions/upload-artifact@v7
        with:
          name: microconfig-macos
          path: ./microconfig

  release:
    name: "Create release"
    needs: [linux, macos, windows, alpine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Zip binaries
        shell: bash
        run: |
          for os in alpine linux macos; do
            chmod +x artifacts/microconfig-$os/microconfig
            zip -j microconfig-$os.zip artifacts/microconfig-$os/microconfig
          done
          zip -j microconfig-windows.zip artifacts/microconfig-windows/microconfig.exe
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "${GITHUB_REF_NAME#v}" \
            artifacts/microconfig.jar/microconfig.jar microconfig-*.zip
