name: Publish to Maven Central Staging

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Gradle
        run: ./gradlew build

      - name: Decrypt secring
        run: ./.github/scripts/decrypt_secring.sh
        env:
          SECRET_PASSPHRASE: ${{ secrets.SECRET_PASSPHRASE }}

      - name: Fill gradle properties
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SIGNING_KEYID: ${{ secrets.SIGNING_KEYID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./.github/scripts/set_gradle_properties.sh ossrhUsername "$SONATYPE_USERNAME"
          ./.github/scripts/set_gradle_properties.sh ossrhPassword "$SONATYPE_PASSWORD"
          ./.github/scripts/set_gradle_properties.sh signing.keyId "$SIGNING_KEYID"
          ./.github/scripts/set_gradle_properties.sh signing.password "$SIGNING_PASSWORD"
          ./.github/scripts/set_gradle_properties.sh signing.secretKeyRingFile "$HOME/secrets/secring.pgp"

      - name: Publish to Maven Central
        run: |
          ./gradlew :microconfig-api:publishNexusPublicationToMavenRepository :microconfig-core:publishNexusPublicationToMavenRepository :microconfig-cli:publishNexusPublicationToMavenRepository :utils:publishNexusPublicationToMavenRepository
          ./gradlew transferToCentralPortal
