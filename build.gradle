plugins {
    alias(libs.plugins.shadow) apply false
    alias(libs.plugins.sonarqube) apply false
}

apply from: 'pomSettings.gradle'

allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'
    apply plugin: 'org.sonarqube'

    apply plugin: 'signing'

    group = 'io.microconfig'
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withJavadocJar()
        withSourcesJar()
    }

    publishing {
        publications {
            nexus(MavenPublication) {
                pom { rootProject.pomConfig(it) }
                from components.java
            }
        }
        repositories {
            maven {
                url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                credentials {
                    username = ossrhUsername
                    password = ossrhPassword
                }
            }
        }
    }

    signing {
        sign publishing.publications.nexus
    }

    dependencies {
        implementation platform(libs.spring.boot.dependencies)
        annotationProcessor platform(libs.spring.boot.dependencies)
        testAnnotationProcessor platform(libs.spring.boot.dependencies)

        compileOnly libs.lombok
        testCompileOnly libs.lombok
        annotationProcessor libs.lombok
        testAnnotationProcessor libs.lombok

        testImplementation libs.bundles.junit, libs.mockito.junit.jupiter
        testRuntimeOnly libs.junit.platform.launcher
    }

    sonar {
        properties {
            property "sonar.projectKey", "microconfig_microconfig"
        }
    }

    jacoco {
        toolVersion = libs.versions.jacoco.get()
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }


    test {
        useJUnitPlatform()
        exclude '**/*IT.class'
    }

    task sourceJar(type: Jar) {
        from sourceSets.main.allJava
    }
}

tasks.register('transferToCentralPortal') {
    group = 'publishing'
    description = 'Transfers deployments uploaded to the staging API into Central Portal'

    def transferUrl = "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${project.group}"
    def token = "${ossrhUsername}:${ossrhPassword}".bytes.encodeBase64().toString()

    doLast {
        def connection = URI.create(transferUrl).toURL().openConnection() as HttpURLConnection
        connection.requestMethod = 'POST'
        connection.setRequestProperty('Authorization', "Bearer ${token}")

        def status = connection.responseCode
        if (status >= 300) {
            throw new GradleException("Central Portal transfer failed with HTTP ${status}: ${connection.errorStream?.text}")
        }
        logger.lifecycle('Deployment transferred to Central Portal, publish it at https://central.sonatype.com/publishing/deployments')
    }
}
