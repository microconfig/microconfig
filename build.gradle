apply from: 'lib.gradle'
apply from: 'pomSettings.gradle'

buildscript {
    repositories {
        mavenCentral()
        maven {
            url = uri("https://plugins.gradle.org/m2/")
        }
    }

    dependencies {
        classpath 'com.gradleup.shadow:shadow-gradle-plugin:9.6.1'
        classpath 'org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:7.5.0.8588'
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'
    apply plugin: 'maven-publish'
    apply plugin: 'org.sonarqube'

    apply plugin: 'signing'

    group = 'io.microconfig'
    version = rootProject.version

    repositories {
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        withJavadocJar()
        withSourcesJar()
    }

    publishing {
        publications {
            nexus(MavenPublication) {
                pom.withXml {
                    def root = asNode()
                    root.appendNode('description', rootProject.pomDescription)
                    root.children().last() + rootProject.pomConfig
                }
                from components.java
            }
        }
        repositories {
            maven {
                url = "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
                credentials {
                    username = ossrhUsername
                    password = ossrhPassword
                }
            }
        }
    }

    signing {
        sign publishing.publications.nexus
    }

    dependencies {
        implementation platform(rootProject.lib.spring_bom)
        annotationProcessor platform(rootProject.lib.spring_bom)
        testAnnotationProcessor platform(rootProject.lib.spring_bom)

        compileOnly rootProject.lib.lombok
        testCompileOnly rootProject.lib.lombok
        annotationProcessor rootProject.lib.lombok
        testAnnotationProcessor rootProject.lib.lombok

        testImplementation rootProject.lib.junit, rootProject.lib.mokito
        testRuntimeOnly rootProject.lib.junit_launcher
    }

    sonar {
        properties {
            property "sonar.projectKey", "microconfig_microconfig"
        }
    }

    jacoco {
        toolVersion = '0.8.16'
    }

    jacocoTestReport {
        reports {
            xml.required = true
            html.required = true
        }
    }


    test {
        useJUnitPlatform()
        exclude '**/*IT.class'
    }

    task sourceJar(type: Jar) {
        from sourceSets.main.allJava
    }
}
